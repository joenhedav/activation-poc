# activation-poc · infraestructura + apps
# Uso:  docker compose up -d --build

x-app-env: &app-env
  KAFKA_BROKERS: kafka:29092
  KAFKAJS_NO_PARTITIONER_WARNING: "1"

x-app-base: &app-base
  restart: unless-stopped
  depends_on:
    kafka-init:
      condition: service_completed_successfully
    mongo:
      condition: service_healthy

services:
  # ───────────── Infraestructura ─────────────
  kafka:
    image: apache/kafka:3.9.0
    container_name: kafka
    ports:
      - "9092:9092" # acceso desde el host (localhost:9092)
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:29092,CONTROLLER://:9093,PLAINTEXT_HOST://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server kafka:29092 > /dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 15s

  kafka-init:
    image: apache/kafka:3.9.0
    container_name: kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    volumes:
      - ./docker/create-topics.sh:/create-topics.sh:ro
    entrypoint: ["/bin/bash", "/create-topics.sh"]
    restart: "no"

  kafka-ui:
    image: ghcr.io/kafbat/kafka-ui:latest # fijar versión al cerrar la POC
    container_name: kafka-ui
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    depends_on:
      kafka:
        condition: service_healthy

  mongo:
    image: mongo:7.0
    container_name: mongo
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      # inicia el replica set de 1 nodo la primera vez y espera a que haya primario
      test:
        - CMD
        - mongosh
        - --quiet
        - --eval
        - "try { rs.status() } catch (e) { rs.initiate({_id:'rs0',members:[{_id:0,host:'mongo:27017'}]}) }; quit(db.hello().isWritablePrimary ? 0 : 1)"
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 10s

  mailhog:
    image: mailhog/mailhog:v1.0.1
    container_name: mailhog
    ports:
      - "8025:8025" # UI web
      - "1025:1025" # SMTP

  # ───────────── Servicios NestJS ─────────────
  # Todos se construyen con docker/Dockerfile.nest; el contexto es la raíz del repo.
  activation-api:
    <<: *app-base
    build:
      context: .
      dockerfile: docker/Dockerfile.nest
      args:
        APP: activation-api
    container_name: activation-api
    ports:
      - "3000:3000"
    environment:
      <<: *app-env
      KAFKA_CLIENT_ID: activation-api
      KAFKA_GROUP_ID: activation-api
      MONGO_URI: mongodb://mongo:27017/activation?replicaSet=rs0
      PORT: 3000

  # Sin container_name ni puertos publicados: permite --scale billing-service=2
  billing-service:
    <<: *app-base
    build:
      context: .
      dockerfile: docker/Dockerfile.nest
      args:
        APP: billing-service
    environment:
      <<: *app-env
      KAFKA_CLIENT_ID: billing-service
      KAFKA_GROUP_ID: billing-svc
      MONGO_URI: mongodb://mongo:27017/billing?replicaSet=rs0

  provisioning-service:
    <<: *app-base
    build:
      context: .
      dockerfile: docker/Dockerfile.nest
      args:
        APP: provisioning-service
    environment:
      <<: *app-env
      KAFKA_CLIENT_ID: provisioning-service
      KAFKA_GROUP_ID: provisioning-svc
      MONGO_URI: mongodb://mongo:27017/provisioning?replicaSet=rs0

  notification-service:
    <<: *app-base
    build:
      context: .
      dockerfile: docker/Dockerfile.nest
      args:
        APP: notification-service
    environment:
      <<: *app-env
      KAFKA_CLIENT_ID: notification-service
      KAFKA_GROUP_ID: notification-svc
      MONGO_URI: mongodb://mongo:27017/notification?replicaSet=rs0
      SMTP_HOST: mailhog
      SMTP_PORT: 1025
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      mongo:
        condition: service_healthy
      mailhog:
        condition: service_started

  crm-analytics-service:
    <<: *app-base
    build:
      context: .
      dockerfile: docker/Dockerfile.nest
      args:
        APP: crm-analytics-service
    environment:
      <<: *app-env
      KAFKA_CLIENT_ID: crm-analytics-service
      KAFKA_GROUP_ID: crm-analytics
      MONGO_URI: mongodb://mongo:27017/crm?replicaSet=rs0

  # La UI se compila con Vite y se sirve con nginx (puerto 80 del contenedor).
  demo-ui:
    build:
      context: ./apps/demo-ui
      args:
        VITE_API_URL: http://localhost:3000 # lo usa el navegador, no el contenedor
    container_name: demo-ui
    ports:
      - "5173:80"
    depends_on:
      - activation-api

  # ───────────── Escenario 5: consumidor nuevo (perfil "loyalty") ─────────────
  # No arranca con "docker compose up". Se levanta aparte:
  #   docker compose --profile loyalty up -d loyalty-service
  # Su consumer group es nuevo, así que lee todo el historial desde el inicio.
  loyalty-service:
    <<: *app-base
    profiles: ["loyalty"]
    build:
      context: .
      dockerfile: docker/Dockerfile.nest
      args:
        APP: loyalty-service
    environment:
      <<: *app-env
      KAFKA_CLIENT_ID: loyalty-service
      KAFKA_GROUP_ID: loyalty
      MONGO_URI: mongodb://mongo:27017/loyalty?replicaSet=rs0

volumes:
  kafka-data:
  mongo-data:
